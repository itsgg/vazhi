name: weekly eval
# Checks the public task bank. It does not score models and it does not change the pool.
# A private paired run is a separate dispatch once a task bank exists outside this repo.
on:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:
concurrency:
  group: eval
  cancel-in-progress: false
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -I scripts/eval.py --tasks-dir eval/public --check
