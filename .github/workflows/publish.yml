name: publish
# Stages a release on npm for each version tag, through npm trusted publishing: GitHub's OIDC
# identity stands in for a token, so none is stored. The trusted publisher on npmjs.com is
# stage-only, so a release goes live only when a maintainer approves it with 2FA (npmjs.com,
# Staged Packages, or `npm stage approve <id>`); a compromised job can stage but never publish.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install -g --ignore-scripts npm@^11.15.0
      - run: npm stage publish
