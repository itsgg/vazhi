name: nightly pool
# Rebuild pool.json from live catalogs and probes. Installed copies of vazhi fetch it from main.
# The job that holds provider keys cannot push; the job that pushes holds no keys and runs no npm.
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
concurrency:
  group: pool
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Probe history decides when a model counts as down; it lives in the cache, not in git.
      - uses: actions/cache/restore@v4
        with:
          path: data/history.json
          key: probe-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: probe-history-
      - run: node scripts/discover.ts
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
      - run: npm test
      - uses: actions/cache/save@v4
        with:
          path: data/history.json
          key: probe-history-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: pool
          path: pool.json
          retention-days: 7
  commit:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: pool
      - name: Commit pool.json if it changed
        run: |
          [ -z "$(git status --porcelain -- pool.json)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool.json
          git commit -m "Refresh the pool from tonight's probes"
          git pull --rebase
          git push
